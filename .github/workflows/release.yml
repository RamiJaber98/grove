# Builds Grove installers for Windows and macOS when a version tag is pushed
# (e.g. `git tag v0.2.0 && git push origin v0.2.0`), and attaches them to a
# draft GitHub release for you to review and publish.
name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: windows-latest
            args: ""
          # One app for both Apple Silicon and Intel Macs.
          - platform: macos-latest
            args: "--target universal-apple-darwin"
    runs-on: ${{ matrix.platform }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.platform == 'macos-latest' && 'aarch64-apple-darwin,x86_64-apple-darwin' || '' }}

      - uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - run: npm ci

      - run: npm test

      - uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tagName: ${{ github.ref_name }}
          releaseName: Grove ${{ github.ref_name }}
          releaseBody: See the assets below to download and install Grove.
          releaseDraft: true
          args: ${{ matrix.args }}

      # Also attach copies without the version in the name, so the README can
      # link to releases/latest/download/<name> and never go stale.
      - name: Upload stable-named installers
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          mkdir -p stable
          if [ "${{ matrix.platform }}" = "windows-latest" ]; then
            cp src-tauri/target/release/bundle/nsis/*-setup.exe stable/Grove_x64-setup.exe
          else
            cp src-tauri/target/universal-apple-darwin/release/bundle/dmg/*.dmg stable/Grove_universal.dmg
          fi
          gh release upload "${{ github.ref_name }}" stable/* --clobber
